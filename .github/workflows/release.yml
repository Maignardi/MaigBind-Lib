name: Release to Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify quality checks and unit tests before publishing
        run: ./gradlew ktlintCheck detekt :maigbind-core:jvmTest :maigbind-core:testAndroidHostTest :maigbind-verifier:test :maigbind-android:testDebugUnitTest :sample-server:test :sample-app:testDebugUnitTest

      - name: Publish and release to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_GPG_PASSWORD }}
        run: ./gradlew :maigbind-core:publishAndReleaseToMavenCentral :maigbind-android:publishAndReleaseToMavenCentral :maigbind-verifier:publishAndReleaseToMavenCentral --no-configuration-cache
